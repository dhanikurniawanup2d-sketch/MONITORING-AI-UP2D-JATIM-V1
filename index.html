<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anggaran AI/AO UP2D Jatim</title>
<link rel="icon" href="logo-pln.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar navy di kiri, bilah judul di atas, area kerja bergaris mint. Ringkasan dulu, detail di bawah. */
:root{
  --bg:#eef5f4; --bg2:#e3efed; --panel:#ffffff; --ink:#122433; --muted:#5a6b78; --line:#d6e2e4;
  --navy:#0b5e87; --navy-d:#073f5b; --teal:#00a4a7; --teal-soft:#dff3f2; --bolt:#ffc72c;
  --accent:#0b5e87; --accent-soft:#e2eff6;
  --good:#16794a; --good-soft:#e0f3e8; --warn:#9a6200; --warn-soft:#fdf1d8; --bad:#c00000; --bad-soft:#fde6e4;
  --bar1:#0b5e87; --bar2:#00a4a7; --bar3:#c9d9de;
  --shadow:0 1px 2px rgba(11,40,60,.06),0 4px 14px rgba(11,40,60,.06);
  --display:Poppins,"Segoe UI",Arial,sans-serif; --body:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif; --mono:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1820; --bg2:#10202a; --panel:#13242f; --ink:#e3eef2; --muted:#93a8b4; --line:#24394a;
  --accent:#5cb8e6; --accent-soft:#153447; --teal-soft:#0f3536; --good:#5fd197; --good-soft:#123426;
  --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18; --bar1:#5cb8e6; --bar2:#22c4c6; --bar3:#2c4352;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1820; --bg2:#10202a; --panel:#13242f; --ink:#e3eef2; --muted:#93a8b4; --line:#24394a;
  --accent:#5cb8e6; --accent-soft:#153447; --teal-soft:#0f3536; --good:#5fd197; --good-soft:#123426;
  --warn:#f0b54a; --warn-soft:#3a2c10; --bad:#ff8a80; --bad-soft:#3d1a18; --bar1:#5cb8e6; --bar2:#22c4c6; --bar3:#2c4352;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.55 var(--body)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.app.solo{grid-template-columns:minmax(0,1fr)}
aside#nav{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#e6f2f8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.brand b{font:600 15px/1.2 var(--display);color:#fff;display:block}.brand small{color:#a9cde0;font-size:11.5px}
aside#nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#cfe4ef;text-decoration:none;font-weight:500;font-size:13.5px}
aside#nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
aside#nav a:hover{background:rgba(255,255,255,.08);color:#fff}
aside#nav a.on{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.18)}
aside#nav .sep{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7fb1c9;padding:14px 12px 4px}
.navfoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px}
.navfoot #who{color:#fff;font-weight:600;font-size:13px}
.navfoot button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#e6f2f8;text-align:left}
.navfoot button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}
.shell{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{font:600 18px var(--display);margin:0}.topbar .sub{color:var(--muted);font-size:12px}
.grow{flex:1}
main{padding:24px 28px 40px;max-width:1440px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  background-image:linear-gradient(180deg,var(--bg2),transparent 260px);background-repeat:no-repeat}
h2{font:600 21px/1.3 var(--display);margin:0;text-wrap:balance}
h3{font:600 15px var(--display);margin:0 0 10px}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}.pagehead p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc,var(--navy))}
.tile .ic{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--tcs,var(--accent-soft));color:var(--tc,var(--navy))}
.tile .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile .l{color:var(--muted);font-size:12px;font-weight:500}.tile .v{font:600 24px/1.25 var(--display);font-variant-numeric:tabular-nums;margin-top:2px}
.tile .n{font-size:12px;color:var(--muted)}
.tile .bar{height:5px;border-radius:3px;background:var(--bg);margin-top:8px;overflow:hidden}.tile .bar i{display:block;height:100%;background:var(--tc,var(--navy))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:var(--bg);position:sticky;top:0}
th:first-child{border-top-left-radius:8px}th:last-child{border-top-right-radius:8px}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 45%,transparent)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)!important}
tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--bg)!important}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.mute{background:var(--bg);color:var(--muted)}.chip.teal{background:var(--teal-soft);color:var(--teal)}
.meter{height:7px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--navy));border-radius:4px}.meter i.over{background:var(--bad)}
button,.btn{font:600 13px var(--body);padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff}button.primary:hover{background:var(--navy-d)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 8px}
button:hover{border-color:var(--accent)}button:disabled{opacity:.6;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input,select,textarea{font:13px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);width:100%}
input[readonly]{background:var(--bg)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.msg{padding:9px 13px;border-radius:10px;font-size:13px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.good{background:var(--good-soft);color:var(--good)}.msg.info{background:var(--teal-soft);color:var(--ink);border-left:3px solid var(--teal);border-radius:0 10px 10px 0}
.overlay{position:fixed;inset:0;background:rgba(6,25,38,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--panel);border-radius:16px;max-width:980px;width:100%;padding:22px 24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}
.toast{position:fixed;right:18px;bottom:18px;z-index:30;max-width:380px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.mono{font-variant-numeric:tabular-nums}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.timeline>div{position:relative}.timeline>div::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:18px}
.chartbox{position:relative;height:270px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.funnel{display:flex;flex-direction:column;gap:9px}.funnel .f{display:grid;grid-template-columns:120px 1fr 120px;gap:10px;align-items:center;font-size:12.5px}
.funnel .f .b{height:22px;border-radius:6px;background:var(--bg);overflow:hidden}.funnel .f .b i{display:block;height:100%;border-radius:6px}
.prkhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;margin:-18px -18px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--teal-soft),transparent);border-radius:14px 14px 0 0}
.prkhead .code{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.logincard{display:grid;grid-template-columns:1fr 1fr;max-width:860px;width:100%;background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(7,63,91,.18)}
.loginbrand{background:linear-gradient(150deg,var(--navy) 0%,var(--navy-d) 70%);color:#fff;padding:36px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.loginbrand h2{color:#fff;font-size:24px}.loginbrand p{color:#cfe4ef;margin:0}
.loginbrand .chev{position:absolute;right:-30px;bottom:-20px;font:700 220px/1 var(--display);color:rgba(255,255,255,.06);letter-spacing:-30px}
.loginform{padding:36px;display:flex;flex-direction:column;gap:12px}
/* Logo PLN dan Danantara: file resmi di repo (logo-pln.png, logo-danantara.png); tersembunyi bila belum diunggah */
.logos{background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:14px;margin:0 4px 10px}
.logos img{height:34px;max-width:104px;object-fit:contain}
.logos:not(:has(img)){display:none}
.logos .div{width:1px;align-self:stretch;background:#d6e2e4}
.logos:not(:has(img+.div+img)) .div{display:none}
.loginbrand .logos{justify-content:flex-start;margin:0 0 6px;align-self:flex-start;padding:10px 16px}
.loginbrand .logos img{height:40px}
/* Pengingat kontrak */
.bell{position:relative;display:inline-flex;align-items:center;gap:6px}
.bell .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px;min-width:18px;text-align:center}
.chip.lewat{background:var(--bad);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border-radius:999px;padding:5px 12px;font-size:12.5px}.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button .n{opacity:.75;margin-left:4px}
.remind{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.remind .d{font:700 20px/1 var(--display);min-width:64px;text-align:center;padding:8px 6px;border-radius:10px}
.remind .d small{display:block;font:500 10.5px var(--body);margin-top:3px}
.lv-lewat .d{background:var(--bad);color:#fff}.lv-kritis .d{background:var(--bad-soft);color:var(--bad)}.lv-segera .d{background:var(--warn-soft);color:var(--warn)}.lv-pantau .d{background:var(--teal-soft);color:var(--teal)}
/* Batang bertumpuk: proyeksi pagu dan tahapan fisik */
.stack{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg);min-width:90px}
.stack{position:relative}.stack i{display:block;height:100%}
.stack.over{box-shadow:inset 0 0 0 1px var(--bad)}.stack b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
button.mini{padding:4px 9px;font-size:12px;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:340px;min-width:200px}
.stack.big{height:24px;border-radius:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.dots{display:flex;gap:4px}.dots i{width:22px;height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}.dots i.on{background:var(--teal);border-color:var(--teal)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){.app{grid-template-columns:1fr}aside#nav{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px}
 .brand,.navfoot,aside#nav .sep{display:none}aside#nav a{white-space:nowrap}.grid3{grid-template-columns:1fr}.logincard{grid-template-columns:1fr}.loginbrand{padding:24px}}
@media (max-width:520px){main{padding:14px}.topbar{padding:12px 14px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app">
<aside id="nav">
  <div class="logos"><img src="logo-pln.png" alt="PLN" onerror="this.remove()"><span class="div"></span><img src="logo-danantara.png" alt="Danantara Indonesia" onerror="this.remove()"></div>
  <div class="brand"><div class="mark"><svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M12 1L2 13h7l-2 8 11-13h-7z" fill="#ffc72c"/></svg></div><div><b>Anggaran AI/AO</b><small>UP2D Jawa Timur</small></div></div>
  <a href="#dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v8H4zM14 4h6v5h-6zM14 13h6v7h-6zM4 16h6v4H4z"/></svg>Dashboard</a>
  <div class="sep">Perencanaan</div>
  <a href="#pagu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2"/></svg>Pagu PRK</a><a href="#rencana"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2zM9 12h6M9 16h4"/></svg>Rencana kontrak</a><a href="#material"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h7v7H4zM13 7h7v7h-7zM8 14v6M16 14v6M4 20h16"/></svg>Rencana material</a>
  <div class="sep">Pelaksanaan</div>
  <a href="#paket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Paket</a><a href="#kontrak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg>Kontrak dan amandemen</a><a href="#khs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 4-9 4-9-4zM3 12l9 4 9-4M3 16l9 4 9-4"/></svg>KHS</a><a href="#fisik"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progres fisik</a><a href="#progres"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/></svg>Volume BoQ</a><a href="#bayar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3zM3 10h18M7 15h3"/></svg>Pembayaran</a>
  <div class="navfoot"><span id="who"></span><button id="btnPass" type="button" hidden>Ganti password</button><button id="btnLogout" type="button" hidden>Keluar</button></div>
</aside>
<div class="shell">
  <div class="topbar" id="topbar"><div><h1 id="ptitle">Pengelolaan Anggaran AI/AO</h1><div class="sub">UP2D Jawa Timur · Tahun anggaran 2026</div></div><div class="grow"></div>
    <span id="mode" class="chip mute">Memuat</span><button id="btnIngat" type="button" class="bell" hidden title="Kontrak mendekati atau melewati tanggal akhir"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>Pengingat<span class="cnt" id="ingatN">0</span></button><button id="btnReload" type="button">Muat ulang</button><button id="btnSetting" type="button">Pengaturan</button></div>
  <main id="view"><div class="panel">Memuat data…</div></main>
</div>
</div>
<div class="overlay" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ===== Konfigurasi ===== */
const DEMO_DATA = /*__DEMO_DATA__*/null;
const TODAY = new Date().toISOString().slice(0,10);
const UP3 = ['MDR','JMB','PNG','PSR','MDN','SBS','MJK','MLG','BJG','SBU','SDA','KDR','BWI','GSK','STB','SBB'];
const UP3_NAMA = {MDR:'Madura',JMB:'Jember',PNG:'Ponorogo',PSR:'Pasuruan',MDN:'Madiun',SBS:'Surabaya Selatan',MJK:'Mojokerto',MLG:'Malang',BJG:'Bojonegoro',SBU:'Surabaya Utara',SDA:'Sidoarjo',KDR:'Kediri',BWI:'Banyuwangi',GSK:'Gresik',STB:'Situbondo',SBB:'Surabaya Barat',GRK:'Gresik',JBR:'Jember'};
// Kode UP3 di workbook progres fisik (urutan kolom TARGET_UP3).
const FUP3 = ['SBS','SBU','SBB','SDA','GRK','MJK','PSR','MLG','KDR','MDN','PNG','BJG','JBR','BWI','STB','MDR'];
const TAHAP = ['0. Rencana','1. Kontrak/KR Terbit','2. Material di Gudang','3. Material di Lokasi','4. Terpasang','5. Beroperasi','6. BAPP/BAST'];
const TAHAP_WARNA = ['#c9d9de','#9fc3d6','#e0a21b','#f2c14e','#5cb8e6','#00a4a7','#16794a'];
const MILESTONE = [['tgl_material','Material tiba'],['tgl_terpasang','Terpasang'],['tgl_komisioning','Komisioning'],['tgl_bast','BAST']];
// Batas hari pengingat akhir kontrak.
const INGAT = {kritis:14, segera:30, pantau:60};
const STATUS = ['Rencana','Menunggu SKKI','Persiapan','ND User','ND Manajer','Pengadaan','Terkontrak','Pelaksanaan','Siap tagih','Terbayar','Batal'];
const PRE = STATUS.slice(0,6);
const JALUR = ['Kontrak Rinci (KHS)','Pengadaan Langsung','Penunjukan Langsung','SMART SOSSYS','Repeat Order','Tender Terbuka'];

    }
  } else if(DEMO_DATA){

  }

  ['PRK','SUB_PRK','PAGU_VERSI','PLOT_AKI','KATALOG','RENCANA_MATERIAL','RENCANA_KONTRAK','KHS','PAKET','BOQ','DISPOSISI','KONTRAK','AMANDEMEN','PROGRES','BAYAR','PROGNOSA'].forEach(k=>D[k]=D[k]||[]);

const KEY = {RENCANA_KONTRAK:'id_rk',PRK:'id_prk',SUB_PRK:'id_sub',PAGU_VERSI:'id_versi',KATALOG:'id_item',RENCANA_MATERIAL:'id_rm',KHS:'id_khs',PAKET:'id_paket',BOQ:'id_boq',DISPOSISI:'id_disposisi',KONTRAK:'id_kontrak',AMANDEMEN:'id_amd',PROGRES:'id_progres',BAYAR:'id_bayar'};

function localId(sh){ let m=0; D[sh].forEach(r=>{const x=String(r[KEY[sh]]||'').match(/(\d+)$/); if(x) m=Math.max(m,+x[1]);}); return PFX[sh]+'-'+String(m+1).padStart(3,'0'); }
async function save(sh, rec){
  if(!canWrite(sh)){ toast('Peran Anda tidak boleh mengubah data ini.','bad'); return null; }
  let out = rec;
  if(CFG.api){
    try{
      const j = await post({sesi:SESI,action:'upsert',sheet:sh,record:rec});
      if(j.kode==='SESI'){ close_(); setSesi(''); showLogin('Sesi Anda berakhir. Silakan login lagi; perubahan terakhir belum tersimpan.'); return null; }
      if(!j.ok){ toast(j.error,'bad'); return null; } out = j.record;
    }catch(e){ toast('Gagal menyimpan: '+e.message,'bad'); return null; }
  } else if(KEY[sh] && !rec[KEY[sh]]) out = Object.assign({},rec,{[KEY[sh]]:localId(sh)});
  const k = KEY[sh];
  const i = k ? D[sh].findIndex(r=>r[k]===out[k]) : sh==='PLOT_AKI' ? D[sh].findIndex(r=>r.id_prk===out.id_prk&&num(r.bulan)===num(out.bulan)) : -1;
  if(i>=0) D[sh][i]=Object.assign({},D[sh][i],out); else D[sh].push(out);
  calc(); toast(CFG.api?'Tersimpan':'Tersimpan di mode demo (tidak masuk spreadsheet)','good');
  return out;
}

/* ===== Perhitungan ===== */
function calc(){
  const amd = {}; D.AMANDEMEN.forEach(a=>{ if(a.status==='Rencana') return; (amd[a.id_ref]=amd[a.id_ref]||[]).push(a); });
  const delta = id => (amd[id]||[]).reduce((s,a)=>s+num(a.nilai_sesudah)-num(a.nilai_sebelum),0);
  const paket = Object.fromEntries(D.PAKET.map(p=>[p.id_paket,p]));
  const F = D.FISIK, nk = x=>String(x||'').trim().toUpperCase();
  const mk = Object.fromEntries(F.MASTER_KONTRAK.map(m=>[nk(m.no_kontrak),m]));
  const fUnit = F.UNIT.map(u=>{ const t=tahapUnit(u); return {...u, tahap:t, lewat: !!(u.target_operasi && !u.tgl_operasi && u.target_operasi<TODAY)}; });
  const fPaket = F.PAKET.map(p=>{ const done=MILESTONE.map(([k])=>!!p[k]); const pc=done.reduce((t,d,i)=>t+(d?num(F.BOBOT[i]):0),0);
    const last=MILESTONE.map(m=>m[1]).filter((_,i)=>done[i]).pop()||'Kontrak'; return {...p, done, pct:pc, tahapNama:last}; });
  const unitK={}, paketK={};
  fUnit.forEach(u=>{ if(u.no_kontrak) (unitK[nk(u.no_kontrak)]=unitK[nk(u.no_kontrak)]||[]).push(u); });
  fPaket.forEach(p=>{ paketK[nk(p.no_kontrak)]=p; });
  const kontrak = D.KONTRAK.map(k=>{
    const m = mk[nk(k.no_kontrak)]||{}; const akhir = k.akhir||m.akhir||'';
    const lastAmd = (amd[k.id_kontrak]||[]).filter(a=>a.akhir_sesudah).slice(-1)[0];
    const akhirBerlaku = lastAmd ? lastAmd.akhir_sesudah : akhir;
    const bast = k.tgl_bast||m.tgl_bast||(paketK[nk(k.no_kontrak)]||{}).tgl_bast||'';
    const us = unitK[nk(k.no_kontrak)]||[], fp = paketK[nk(k.no_kontrak)];
    let fis=null;
    if(fp) fis={pct:fp.pct, ket:fp.tahapNama, sumber:'paket'};
    else if(us.length) fis={pct:us.filter(u=>u.tahap>=5).length/us.length, ket:`${us.filter(u=>u.tahap>=5).length}/${us.length} unit beroperasi`, sumber:'unit', terpasang:us.filter(u=>u.tahap>=4).length/us.length};
    const sisaHari = akhirBerlaku ? days(TODAY,akhirBerlaku) : null;
    const lv = bast||sisaHari===null ? '' : sisaHari<0 ? 'lewat' : sisaHari<=INGAT.kritis ? 'kritis' : sisaHari<=INGAT.segera ? 'segera' : sisaHari<=INGAT.pantau ? 'pantau' : '';
    return {...k, akhir, awal:k.awal||m.awal||'', akhirBerlaku, diperpanjang:!!lastAmd&&lastAmd.akhir_sesudah!==akhir, bast, sisaHari, lv, fis,
      amd:delta(k.id_kontrak), berlaku:num(k.nilai_awal)+delta(k.id_kontrak), paket:paket[k.id_paket]||{}};
  });
  const kById = Object.fromEntries(kontrak.map(k=>[k.id_kontrak,k]));
  const bayarK = {}; D.BAYAR.forEach(b=>bayarK[b.id_kontrak]=(bayarK[b.id_kontrak]||0)+num(b.nilai));
  kontrak.forEach(k=>{ k.bayar=bayarK[k.id_kontrak]||0; k.fisik=fisik(k); });
  const sub = D.SUB_PRK.map(s=>{
    const ks = kontrak.filter(k=>k.id_sub===s.id_sub || (!k.id_sub && k.paket.id_sub===s.id_sub));
    const proses = D.PAKET.filter(p=>p.id_sub===s.id_sub && PRE.includes(p.status)).reduce((t,p)=>t+num(p.rab),0);
    const kon = ks.reduce((t,k)=>t+k.berlaku,0), byr = ks.reduce((t,k)=>t+k.bayar,0);
    const rk = (D.RENCANA_KONTRAK||[]).filter(r=>r.id_sub===s.id_sub && r.status==='Rencana').reduce((t,r)=>t+num(r.nilai_rencana),0);
    const us = fUnit.filter(u=>u.id_sub===s.id_sub), ps = fPaket.filter(p=>p.id_sub===s.id_sub);
    const proyeksi = kon+proses+rk;
    return {...s, ai:num(s.ai_rencana), kontrak:kon, proses, rk, proyeksi, proyPct:num(s.ai_rencana)?proyeksi/num(s.ai_rencana):0, sisa:num(s.ai_rencana)-kon-proses, sisaRk:num(s.ai_rencana)-kon-proses-rk, bayar:byr, serapan:num(s.ai_rencana)?kon/num(s.ai_rencana):0,
      fUnit:us.length, fOps:us.filter(u=>u.tahap>=5).length, fPasang:us.filter(u=>u.tahap>=4).length, fPaket:ps.length, fPaketPct:ps.length?ps.reduce((t,p)=>t+p.pct,0)/ps.length:null};
  });
  const prk = D.PRK.map(p=>{
    const ss = sub.filter(s=>s.id_prk===p.id_prk);
    const sum = f => ss.reduce((t,s)=>t+s[f],0);
    const aki = D.PLOT_AKI.filter(a=>a.id_prk===p.id_prk).reduce((t,a)=>t+num(a.nilai),0) || num(p.aki);
    return {...p, subs:ss, ai:num(p.ai_terbit), rencana:sum('ai'), kontrak:sum('kontrak'), proses:sum('proses'), rk:sum('rk'), proyeksi:sum('proyeksi'), sisa:num(p.ai_terbit)-sum('kontrak')-sum('proses'), sisaRk:num(p.ai_terbit)-sum('kontrak')-sum('proses')-sum('rk'), bayar:sum('bayar'), akiTotal:aki};
  });
  const khs = D.KHS.map(h=>{
    const d = delta(h.id_khs), last=(amd[h.id_khs]||[]).slice(-1)[0];
    const akhir = last && last.akhir_sesudah ? last.akhir_sesudah : h.akhir;
    const terpakai = kontrak.filter(k=>k.id_khs===h.id_khs).reduce((t,k)=>t+k.berlaku,0);
    const berlaku = num(h.nilai_awal)+d;
    return {...h, amd:d, berlaku, akhirBerlaku:akhir, terpakai, sisa:berlaku-terpakai, hidup: akhir ? akhir>=TODAY : true, sisaHari: akhir?days(TODAY,akhir):null};
  });
  C = {kontrak, kById, sub, prk, khs, amd, paket, fUnit, fPaket};
  const ORD={lewat:0,kritis:1,segera:2,pantau:3};
  C.ingat = kontrak.filter(k=>k.lv).sort((a,b)=>ORD[a.lv]-ORD[b.lv]||a.sisaHari-b.sisaHari);
  C.tot = ['ai','kontrak','proses','rk','proyeksi','sisa','sisaRk','bayar','akiTotal'].reduce((o,f)=>(o[f]=prk.reduce((t,p)=>t+num(p[f]),0),o),{});
  C.flags = flags();
  const nI=C.ingat.filter(k=>k.lv!=='pantau').length; const b=$('#ingatN'); if(b){ b.textContent=nI; b.hidden=!nI; }
}
function tahapUnit(u){
  return u.tgl_bast?6:u.tgl_operasi?5:u.tgl_terpasang?4:u.tgl_keluar?3:u.tgl_gr?2:(u.no_kr||u.no_kontrak)?1:0;
}
function fisik(k){
  const boq = D.BOQ.filter(b=>b.id_paket===k.id_paket);
  if(!boq.length) return null;
  let tgt=0, done=0;
  boq.forEach(b=>{
    const h = num(b.harga)||num((D.KATALOG.find(i=>i.id_item===b.id_item)||{}).harga_satuan);
    const v = Math.max(0,...D.PROGRES.filter(p=>p.id_kontrak===k.id_kontrak&&p.id_item===b.id_item&&p.up3===b.up3).map(p=>num(p.vol_terpasang)));
    tgt += num(b.volume)*h; done += Math.min(v,num(b.volume))*h;
  });
  return tgt ? done/tgt : 0;
}
function flags(){
  const f=[];
  C.sub.filter(s=>s.sisa<0).forEach(s=>f.push({lv:'bad',t:'Perlu rekomposisi',d:`${s.uraian}: melebihi AI Rencana sebesar Rp ${rp(-s.sisa)}`,go:'#pagu'}));
  C.khs.filter(h=>h.hidup && h.sisa>1 && h.sisaHari!==null && h.sisaHari<=60).forEach(h=>f.push({lv:'warn',t:'KHS segera berakhir',d:`${h.uraian} (${h.pemenang}): sisa kuota Rp ${rp(h.sisa)}, berakhir ${h.akhirBerlaku}`,go:'#khs'}));
  D.PAKET.filter(p=>p.tgl_pr && p.tgl_nd_man && p.tgl_pr<p.tgl_nd_man).forEach(p=>f.push({lv:'warn',t:'Urutan tanggal',d:`${p.id_paket} ${(p.nama_paket||'').slice(0,60)}: PR (${p.tgl_pr}) sebelum ND Manajer (${p.tgl_nd_man})`,go:'#paket'}));
  C.kontrak.filter(k=>k.lv==='kritis'||k.lv==='segera').forEach(k=>f.push({lv:k.lv==='kritis'?'bad':'warn',t:`Kontrak berakhir ${k.sisaHari} hari lagi`,d:`${k.no_kontrak||k.id_kontrak} (${k.vendor}) · akhir ${k.akhirBerlaku}${k.fis?' · fisik '+pct(k.fis.pct):''}: siapkan BAST atau amandemen waktu`,go:'#kontrak'}));
  const lw=C.kontrak.filter(k=>k.lv==='lewat'); if(lw.length) f.push({lv:'bad',t:`${lw.length} kontrak lewat masa, BAST belum ada`,d:'Perlu amandemen perpanjangan atau input BAST. Buka Kontrak > filter Lewat masa.',go:'#kontrak'});
  const bad=C.fUnit.filter(u=>u.validasi&&u.validasi!=='OK'&&u.tahap>=4).length; if(bad) f.push({lv:'warn',t:'Data progres fisik perlu dicek',d:`${bad} unit terpasang/beroperasi dengan catatan validasi (mis. tanpa evidence atau target operasi kosong)`,go:'#fisik'});
  D.PAKET.filter(p=>PRE.includes(p.status)).forEach(p=>{ const a=p.tgl_nd_user?days(p.tgl_nd_user,TODAY):null; if(a!==null&&a>30) f.push({lv:'warn',t:'Proses lama',d:`${p.id_paket} ${(p.nama_paket||'').slice(0,60)}: ${a} hari sejak ND User, status ${p.status}`,go:'#paket'}); });
  return f;
}

const VIEWS = {dashboard:vDash, pagu:vPagu, rencana:vRencana, paket:vPaket, kontrak:vKontrak, khs:vKhs, material:vMaterial, fisik:vFisik, progres:vProgres, bayar:vBayar};

function modal(html){ $('#modal').innerHTML=html; $('#ov').classList.add('on'); const f=$('#modal').querySelector('input,select,textarea,button'); if(f) f.focus(); }
function close_(){ $('#ov').classList.remove('on'); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') close_(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close_(); });
function form(title, fields, rec, onSave, note, after){
  rec = rec||{};
  const inp = f => {
    const v = rec[f.k]!==undefined?rec[f.k]:(f.def!==undefined?f.def:'');
    const id='f_'+f.k;
    let el;
    if(f.type==='select') el=`<select id="${id}"${f.ro?' disabled':''}>${opt(f.options,v,f.blank)}</select>`;
    else if(f.type==='textarea') el=`<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    else el=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}"${f.type==='number'?' step="any" min="0"':''}${f.ro?' readonly':''}>`;
    return `<label class="${f.wide?'wide':''}" for="${id}">${esc(f.label)}${f.req?' *':''}${el}</label>`;
  };
  modal(`<div class="head"><h2>${esc(title)}</h2><button type="button" onclick="close_()" aria-label="Tutup">Tutup</button></div>
    ${note?`<div class="msg info">${note}</div>`:''}
    <form id="frm" class="form" novalidate>${fields.map(inp).join('')}<div class="wide" id="ferr"></div>
    <div class="wide row"><button class="primary" type="submit">Simpan</button><button type="button" onclick="close_()">Batal</button></div></form>`);
  $('#frm').addEventListener('submit', async e=>{
    e.preventDefault();
    const out = {...rec};
    for(const f of fields){ let v=$('#f_'+f.k).value.trim(); if(f.type==='number') v = v===''?'':Number(v); out[f.k]=v; }
    const miss = fields.filter(f=>f.req && (out[f.k]===''||out[f.k]===undefined)).map(f=>f.label);
    if(miss.length){ $('#ferr').innerHTML=`<div class="msg bad">Lengkapi: ${esc(miss.join(', '))}.</div>`; return; }
    const warn = onSave.check ? onSave.check(out) : null;
    if(warn && /Perbaiki dulu/.test(warn)){ $('#ferr').innerHTML=`<div class="msg bad">${warn}</div>`; return; }
    if(warn && !rec._ok){ $('#ferr').innerHTML=`<div class="msg warn">${warn}</div>`; rec._ok=true; return; }
    delete out._ok; const r = await onSave(out); if(r!==false) close_();
  });
  $('#frm').addEventListener('input',()=>{ $('#ferr').innerHTML=''; rec._ok=false; });
  if(after) after();
}

function kurvaProyeksi(){
  if(!window.Chart){ $('#chp').parentNode.innerHTML='<div class="muted">Grafik tidak bisa dimuat (pustaka grafik tidak tersedia).</div>'; return; }
  const inP=id=>!PP||String(id).split('|')[0]===PP||String(id)===PP;
  const nm=new Date().getMonth()+1, bl=d=>{ const m=String(d||'').match(/^2026-(\d{2})/); if(m) return +m[1]; return String(d||'')<'2026'&&d?1:0; };
  const nxt=Math.min(12,nm+1), real=Array(13).fill(0), proy=Array(13).fill(0);
  C.kontrak.filter(k=>inP(k.id_sub||k.paket.id_sub)).forEach(k=>{ const m=bl(k.awal)||bl(k.tgl_po)||nm; real[Math.min(12,m)]+=k.berlaku; });
  D.PAKET.filter(p=>PRE.includes(p.status)&&inP(p.id_sub)).forEach(p=>{ const m=Math.max(bl(p.target_terbit)||nxt,nm); proy[Math.min(12,m)]+=num(p.rab); });
  (D.RENCANA_KONTRAK||[]).filter(r=>r.status==='Rencana'&&inP(r.id_sub)).forEach(r=>{ const m=Math.max(bl(r.target_kontrak)||nxt,nm); proy[Math.min(12,m)]+=num(r.nilai_rencana); });
  const cum=(a,upto)=>{ let t=0; return a.slice(1).map((v,i)=>{ t+=v; return i+1<=upto?t/1e9:null; }); };
  const realC=cum(real,nm), allC=(()=>{ let t=0; return real.slice(1).map((v,i)=>{ t+=v+proy[i+1]; return t/1e9; }); })();
  const proyC=allC.map((v,i)=>i+1>=nm?v:null);
  const aiP=PP?num((C.prk.find(p=>p.id_prk===PP)||{}).ai):C.tot.ai;
  const css=getComputedStyle(document.documentElement), col=v=>css.getPropertyValue(v).trim();
  const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  chart=new Chart($('#chp'),{type:'line',data:{labels:BLN,datasets:[
    {label:'Realisasi terkontrak',data:realC,borderColor:col('--bar1'),backgroundColor:'rgba(11,94,135,.12)',fill:true,tension:.25,pointRadius:3},
    {label:'Proyeksi terkontrak',data:proyC,borderColor:'#6b5bd3',borderDash:[6,4],tension:.25,pointRadius:3},
    {label:'AI Terbit',data:BLN.map(()=>aiP/1e9),borderColor:col('--bad'),borderWidth:1.5,borderDash:[2,3],pointRadius:0}]},
    options:{maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},scales:{y:{beginAtZero:true,grid:{color:col('--line')},ticks:{color:col('--muted'),callback:v=>v+' M'}},x:{grid:{display:false},ticks:{color:col('--muted')}}},
    plugins:{legend:{position:'bottom',labels:{color:col('--ink'),boxWidth:12,usePointStyle:true}},tooltip:{callbacks:{label:c=>c.parsed.y===null?'':c.dataset.label+': Rp '+c.parsed.y.toLocaleString('id-ID',{maximumFractionDigits:2})+' M'}}}}});
}

async function saveProg(i){
  const b=window._boq[i], v=$('#pv'+i).value;
  if(v===''){ toast('Isi volume terpasang dulu.','bad'); return; }
  if(num(v)>num(b.volume)){ toast(`Volume terpasang melebihi BoQ (${b.volume}).`,'bad'); return; }
  const bulan=num($('#pb'+i).value);
  const prev=Math.max(0,...D.PROGRES.filter(p=>p.id_kontrak===PK&&p.id_item===b.id_item&&p.up3===b.up3&&num(p.bulan)<bulan).map(p=>num(p.vol_terpasang)));
  if(num(v)<prev){ toast(`Kumulatif tidak boleh turun dari bulan sebelumnya (${prev}).`,'bad'); return; }
  const ex=D.PROGRES.find(p=>p.id_kontrak===PK&&p.id_item===b.id_item&&p.up3===b.up3&&num(p.bulan)===bulan);
  const r=await save('PROGRES',{id_progres:ex?ex.id_progres:'',id_kontrak:PK,id_item:b.id_item,up3:b.up3,bulan,vol_terpasang:num(v),catatan_mdu:$('#pm'+i).value,kendala:$('#pd'+i).value,oleh:USER.email||USER.nama,tanggal_input:TODAY});
  if(r) vProgres();
}

async function saveFisik(sh, rec){

    try{ const j=await post({sesi:SESI,action:'upsert',sheet:sh,record:rec});
      if(j.kode==='SESI'){ close_(); setSesi(''); showLogin('Sesi berakhir. Perubahan terakhir belum tersimpan.'); return null; }
      if(!j.ok){ toast(j.error,'bad'); return null; } out=j.record;
    }catch(e){ toast('Gagal menyimpan: '+e.message,'bad'); return null; }
  } else if(!out.id){ out.id=(sh==='FISIK_UNIT'?out.sheet:'15 PAKET')+'!demo'+Date.now(); }
  const L=sh==='FISIK_UNIT'?D.FISIK.UNIT:D.FISIK.PAKET; const i=L.findIndex(x=>x.id===rec.id||x.id===out.id);
  if(sh==='FISIK_UNIT'){ const k=C.kontrak.find(x=>x.no_kontrak&&x.no_kontrak===out.no_kontrak); out.id_sub=(k&&k.id_sub)||out.id_sub; out.sub_perkiraan=''; }
  else { const k=C.kontrak.find(x=>x.no_kontrak===out.no_kontrak); out.id_sub=(k&&k.id_sub)||out.id_sub||''; if(k){ out.uraian=out.uraian||k.paket.nama_paket||''; out.vendor=out.vendor||k.vendor; out.akhir_kontrak=out.akhir_kontrak||k.akhir; } }
  if(i>=0) L[i]={...L[i],...out}; else L.push(out);
  calc(); vFisik(); toast(CFG.api?'Tersimpan ke workbook progres fisik':'Tersimpan di mode demo (tidak masuk spreadsheet)','good'); return out;
}

   {check:o=>{ if(o.tgl_operasi&&o.tgl_terpasang&&o.tgl_operasi<o.tgl_terpasang) return 'Tanggal beroperasi sebelum tanggal terpasang. Perbaiki dulu.';
     if(o.tgl_operasi&&o.tgl_operasi>TODAY) return 'Tanggal beroperasi setelah hari ini. Perbaiki dulu.';
     const w=[]; if(o.tgl_operasi&&!o.evidence) w.push('beroperasi tanpa evidence'); if(o.tgl_bast&&!o.tgl_operasi) w.push('BAST tanpa tanggal operasi'); if(!o.target_operasi) w.push('target operasi kosong');
     return w.length?'Catatan: '+w.join(', ')+'. Klik Simpan lagi untuk tetap menyimpan.':null; }}),
   `Data ditulis ke sheet pekerjaan di workbook progres fisik (kolom input saja). Status, sub PRK dari kontrak, vendor, dan validasi tetap dihitung rumus di sheet. Bila kontrak jasa belum ada, sub PRK yang dipilih dicatat di kolom Sub-PRK.${u.sub_perkiraan?' <b>Sub PRK unit ini masih perkiraan</b>; pilih sub PRK yang benar lalu simpan.':''}`,
  ()=>{ const sj=$('#f_jenis'), ss=$('#f_id_sub'), sk=$('#f_no_kontrak');
    $('#f_sheet').addEventListener('change',e=>{ sj.innerHTML=opt(jenisOf(e.target.value),'', 'Pilih jenis'); });
    ss.addEventListener('change',e=>{ const cur=sk.value; sk.innerHTML=opt(kontrakOpts(e.target.value),cur,'Belum ada kontrak'); });
    sk.addEventListener('change',e=>{ const k=C.kontrak.find(x=>x.no_kontrak===e.target.value); if(k&&k.id_sub) ss.value=k.id_sub; }); });
}
function editFP(id){
  const F=D.FISIK, p=id?F.PAKET.find(x=>x.id===id):{};
  const used=new Set(F.PAKET.map(x=>String(x.no_kontrak).trim().toUpperCase()));
  const kOpts=C.kontrak.filter(k=>k.no_kontrak&&(id||!used.has(String(k.no_kontrak).trim().toUpperCase()))).map(k=>({v:k.no_kontrak,l:`${k.no_kontrak} · ${k.vendor} · ${(k.paket.nama_paket||'').slice(0,40)}`}));
  if(p.no_kontrak&&!kOpts.some(o=>o.v===p.no_kontrak)) kOpts.unshift({v:p.no_kontrak,l:p.no_kontrak});
  form(id?'Ubah milestone paket: '+tc(p.uraian).slice(0,50):'Catat milestone paket lumpsum',[
    {k:'no_kontrak',label:'Kontrak',type:'select',req:1,options:kOpts,blank:'Pilih kontrak',wide:1,ro:!!id},
    {k:'tgl_material',label:`Material tiba / delivery (${pct(F.BOBOT[0])})`,type:'date'},{k:'tgl_terpasang',label:`Terpasang / instalasi (${pct(F.BOBOT[1])})`,type:'date'},
    {k:'tgl_komisioning',label:`Komisioning / uji terima (${pct(F.BOBOT[2])})`,type:'date'},{k:'tgl_bast',label:`BAST (${pct(F.BOBOT[3])})`,type:'date'},
    {k:'evidence',label:'Evidence (link)',wide:1},{k:'keterangan',label:'Keterangan',type:'textarea',wide:1}],p,
  Object.assign(async o=>{ if(id){ o.id=id; o.no_kontrak=p.no_kontrak; } const r=await saveFisik('FISIK_PAKET',o); if(!r) return false; },
   {check:o=>{ const d=MILESTONE.map(m=>o[m[0]]); for(let i=1;i<4;i++) if(d[i]&&d[i-1]&&d[i]<d[i-1]) return `Urutan terbalik: ${MILESTONE[i][1]} sebelum ${MILESTONE[i-1][1]}. Perbaiki dulu.`;
     if(o.tgl_bast&&!o.evidence) return 'BAST tanpa evidence. Klik Simpan lagi untuk tetap menyimpan.'; return null; }}),
   'Ditulis ke sheet 15 PAKET (satu baris per kontrak). % fisik = jumlah bobot milestone yang sudah bertanggal.');
}

/* ===== Tampilan: Pembayaran ===== */
function vBayar(){
  const bl=[...Array(12)].map((_,m)=>m+1);
  const real=m=>D.BAYAR.filter(b=>b.tgl_bayar&&+String(b.tgl_bayar).slice(5,7)===m).reduce((t,b)=>t+num(b.nilai),0);
  const plot=m=>D.PLOT_AKI.filter(a=>num(a.bulan)===m).reduce((t,a)=>t+num(a.nilai),0);
  let cr=0,cp=0;
  $('#view').innerHTML=`<div class="row"><h2>Pembayaran dan serapan kas</h2><div class="grow"></div>${canWrite('BAYAR')?'<button class="primary" type="button" onclick="editBayar()">Catat pembayaran</button>':''}${canWrite('PLOT_AKI')?'<button type="button" onclick="editAki()">Isi plot AKI</button>':''}</div>
  <div class="tiles"><div class="tile"><div class="l">Terbayar</div><div class="v">${M(C.tot.bayar)}</div></div><div class="tile"><div class="l">Belum terbayar dari nilai kontrak</div><div class="v">${M(C.kontrak.reduce((t,k)=>t+k.berlaku-k.bayar,0))}</div></div>
   <div class="tile"><div class="l">Siap tagih</div><div class="v">${C.kontrak.filter(k=>k.tgl_bast&&k.bayar<k.berlaku).length}</div><div class="n">kontrak sudah BAST, belum lunas</div></div></div>
  <div class="panel scroll"><h3>Realisasi kas vs plot AKI per bulan (Rp)</h3><table><thead><tr><th>Bulan</th><th class="n">Plot AKI</th><th class="n">Realisasi</th><th class="n">Kumulatif plot</th><th class="n">Kumulatif realisasi</th><th>Capaian kumulatif</th></tr></thead><tbody>
   ${bl.map(m=>{cr+=real(m);cp+=plot(m);return `<tr><td>${new Date(2026,m-1,1).toLocaleDateString('id-ID',{month:'long'})}</td><td class="n">${rp(plot(m))}</td><td class="n">${rp(real(m))}</td><td class="n">${rp(cp)}</td><td class="n">${rp(cr)}</td><td>${cp?meter(cr/cp):'<span class="muted">plot belum diisi</span>'}</td></tr>`}).join('')}</tbody></table></div>
  <div class="panel scroll"><h3>Daftar pembayaran</h3>${D.BAYAR.length?`<table><thead><tr><th>Tgl bayar</th><th>Kontrak</th><th>Vendor</th><th>Termin</th><th class="n">Nilai</th><th></th></tr></thead><tbody>${D.BAYAR.slice().sort((a,b)=>String(b.tgl_bayar).localeCompare(a.tgl_bayar)).map(b=>{const k=C.kById[b.id_kontrak]||{};return `<tr><td>${esc(b.tgl_bayar)}</td><td class="mono" style="font-size:12px">${esc(k.no_kontrak)}</td><td>${esc(k.vendor)}</td><td>${esc(b.termin)}</td><td class="n">${rp(b.nilai)}</td><td>${canWrite('BAYAR')?`<button type="button" onclick="editBayar('${b.id_bayar}')">Ubah</button>`:''}</td></tr>`}).join('')}</tbody></table>`:'<div class="muted">Belum ada pembayaran tercatat untuk 2026.</div>'}</div>`;
}
function editBayar(id){
  const b=id?D.BAYAR.find(x=>x.id_bayar===id):{termin:'Termin 1'};
  form(id?'Ubah pembayaran':'Catat pembayaran',[{k:'id_kontrak',label:'Kontrak',type:'select',options:C.kontrak.map(k=>({v:k.id_kontrak,l:`${k.no_kontrak} · ${k.vendor} (sisa Rp ${rp(k.berlaku-k.bayar)})`})),req:1,wide:1},
   {k:'termin',label:'Termin',type:'select',options:['Termin 1','Termin 2','Termin 3','Pelunasan','Bulanan']},{k:'tgl_tagih',label:'Tanggal tagih',type:'date'},{k:'tgl_bayar',label:'Tanggal bayar',type:'date',req:1},{k:'nilai',label:'Nilai bayar (Rp)',type:'number',req:1},{k:'bukti',label:'Bukti / nomor dokumen',wide:1}],b,
  Object.assign(async o=>{ const k=C.kById[o.id_kontrak]; o.id_sub=k.id_sub||k.paket.id_sub; o.oleh=USER.email||USER.nama;
    const sudah=D.BAYAR.filter(x=>x.id_kontrak===o.id_kontrak&&x.id_bayar!==o.id_bayar).reduce((t,x)=>t+num(x.nilai),0);
    if(sudah+num(o.nilai)>k.berlaku+1){ toast(`Total bayar melebihi nilai kontrak berlaku (Rp ${rp(k.berlaku)}).`,'bad'); return false; }
    const r=await save('BAYAR',o); if(!r) return false;
    if(sudah+num(o.nilai)>=k.berlaku-1) await save('PAKET',{...k.paket,status:'Terbayar'}); route(); },
   {check:o=>o.tgl_tagih&&o.tgl_bayar&&o.tgl_tagih>o.tgl_bayar?'Tanggal tagih setelah tanggal bayar. Klik Simpan lagi untuk tetap menyimpan.':null}));
}
function editAki(){
  form('Isi plot AKI per bulan',[{k:'id_prk',label:'PRK',type:'select',options:D.PRK.map(p=>({v:p.id_prk,l:p.no_prk+' '+p.uraian})),req:1,wide:1}].concat([...Array(12)].map((_,m)=>({k:'b'+(m+1),label:new Date(2026,m,1).toLocaleDateString('id-ID',{month:'long'})+' (Rp)',type:'number',def:0}))),{},
  async o=>{ for(let m=1;m<=12;m++){ const ex=D.PLOT_AKI.find(a=>a.id_prk===o.id_prk&&num(a.bulan)===m); if(num(o['b'+m])||ex){ const r=await save('PLOT_AKI',{id_prk:o.id_prk,bulan:m,nilai:num(o['b'+m])}); if(!r) return false; } } route(); });
}

/* ===== Login ===== */
function showLogin(msg){
  D=null; USER=null; $('#app').classList.add('solo'); $('#nav').hidden=true; $('#topbar').hidden=true; $('#btnPass').hidden=true; $('#btnLogout').hidden=true; $('#who').textContent='';
  $('#view').innerHTML=`<div class="login"><div class="logincard">
    <div class="loginbrand"><div class="logos"><img src="logo-pln.png" alt="PLN" onerror="this.remove()"><span class="div"></span><img src="logo-danantara.png" alt="Danantara Indonesia" onerror="this.remove()"></div><svg width="44" height="48" viewBox="0 0 20 22" aria-hidden="true"><path d="M12 1L2 13h7l-2 8 11-13h-7z" fill="#ffc72c"/></svg>
      <h2>Pengelolaan Anggaran AI/AO</h2><p>UP2D Jawa Timur · Tahun anggaran 2026</p>
      <p style="margin-top:auto;font-size:12.5px">Pagu, proyeksi terkontrak, paket, amandemen, progres fisik, dan pembayaran dalam satu tempat, langsung dari workbook MONITORING SKKI dan MONITORING PROGRESS FISIK.</p><div class="chev">››</div></div>
    <div class="loginform"><h2>Masuk</h2><div class="muted">Gunakan username dan password dari Admin Perencanaan.</div>
    ${msg?`<div class="msg info">${esc(msg)}</div>`:''}
    <form id="lf" class="form" style="grid-template-columns:1fr" novalidate>
      <label for="l_user">Username<input id="l_user" autocomplete="username" autocapitalize="none" required></label>
      <label for="l_pass">Password<input id="l_pass" type="password" autocomplete="current-password" required></label>
      <div id="l_err"></div>
      <button class="primary" type="submit" id="l_btn" style="padding:10px">Masuk</button>
    </form></div></div></div>`;
  $('#l_user').focus();
  $('#lf').addEventListener('input',()=>$('#l_err').innerHTML='');
  $('#lf').addEventListener('submit',async e=>{
    e.preventDefault();
    const u=$('#l_user').value.trim(), p=$('#l_pass').value;
    if(!u||!p){ $('#l_err').innerHTML='<div class="msg bad">Isi username dan password.</div>'; return; }
    $('#l_btn').disabled=true; $('#l_btn').textContent='Memeriksa…';
    try{
      const j=await post({action:'login',username:u,password:p});
      if(!j.ok){ $('#l_err').innerHTML=`<div class="msg bad">${esc(j.error)}</div>`; return; }
      setSesi(j.sesi); await load();
      if(j.wajib_ganti) gantiPassword(true);
    }catch(x){ $('#l_err').innerHTML='<div class="msg bad">Tidak bisa terhubung ke server. Periksa koneksi internet.</div>'; }
    finally{ const b=$('#l_btn'); if(b){ b.disabled=false; b.textContent='Masuk'; } }
  });
}
function gantiPassword(wajib){
  modal(`<div class="head"><h2>Ganti password</h2>${wajib?'':'<button type="button" onclick="close_()">Tutup</button>'}</div>
  ${wajib?'<div class="msg warn">Anda masuk dengan password awal dari Admin. Buat password pribadi sekarang.</div>':''}
  <form id="pf" class="form" style="grid-template-columns:1fr" novalidate>
    <label for="p_old">Password saat ini<input id="p_old" type="password" autocomplete="current-password"></label>
    <label for="p_new">Password baru (minimal 8 karakter)<input id="p_new" type="password" autocomplete="new-password"></label>
    <label for="p_new2">Ulangi password baru<input id="p_new2" type="password" autocomplete="new-password"></label>
    <div id="p_err"></div><div class="row"><button class="primary" type="submit">Simpan password</button></div></form>`);
  $('#pf').addEventListener('input',()=>$('#p_err').innerHTML='');
  $('#pf').addEventListener('submit',async e=>{
    e.preventDefault();
    const a=$('#p_old').value,b=$('#p_new').value,c=$('#p_new2').value;
    const err=t=>$('#p_err').innerHTML=`<div class="msg bad">${esc(t)}</div>`;
    if(!a) return err('Isi password saat ini.'); if(b.length<8) return err('Password baru minimal 8 karakter.'); if(b!==c) return err('Ulangan password baru tidak sama.'); if(a===b) return err('Password baru harus berbeda dari yang lama.');
    try{ const j=await post({sesi:SESI,action:'ganti_password',lama:a,baru:b});
      if(j.kode==='SESI'){ close_(); setSesi(''); showLogin('Sesi berakhir. Login lagi lalu ganti password.'); return; }
      if(!j.ok) return err(j.error); close_(); toast('Password berhasil diganti','good');
    }catch(x){ err('Tidak bisa terhubung ke server.'); }
  });
}
async function logout(){
  try{ if(CFG.api&&SESI) await post({sesi:SESI,action:'logout'}); }catch(e){}
  setSesi(''); showLogin('Anda sudah keluar.');
}

/* ===== Pengaturan ===== */
function settings(){
  modal(`<div class="head"><h2>Pengaturan koneksi</h2><button type="button" onclick="close_()">Tutup</button></div>
  <div class="msg info">URL API adalah alamat /exec dari deployment Apps Script. Bila URL sudah ditanam di index.html, pengaturan ini tidak perlu diisi.</div>
  <form id="sf" class="form"><label class="wide" for="s_api">URL API Apps Script<input id="s_api" value="${esc(CFG.api)}" placeholder="https://script.google.com/macros/s/…/exec"${API_URL?' readonly':''}></label>
  <div class="wide row">${API_URL?'':'<button class="primary" type="submit">Simpan dan muat</button>'}${DEMO_DATA?'<button type="button" id="s_demo">Pakai mode demo</button>':''}</div></form>`);
  $('#sf').addEventListener('submit',e=>{e.preventDefault(); if(API_URL) return; CFG={api:$('#s_api').value.trim()}; try{localStorage.setItem('aiao_cfg',JSON.stringify(CFG));}catch(x){} close_(); load();});
  const dm=$('#s_demo'); if(dm) dm.addEventListener('click',()=>{CFG={api:''}; try{localStorage.removeItem('aiao_cfg');}catch(x){} close_(); load();});
}
$('#btnSetting').addEventListener('click',settings);
$('#btnReload').addEventListener('click',load);
$('#btnPass').addEventListener('click',()=>gantiPassword(false));
$('#btnLogout').addEventListener('click',logout);
$('#btnIngat').addEventListener('click',()=>{ KF='ingat'; if(location.hash==='#kontrak') vKontrak(); else location.hash='#kontrak'; });
if(API_URL) $('#btnSetting').hidden=true;
load();
</script>
